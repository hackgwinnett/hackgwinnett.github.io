name: Publish [GitHub Pages]

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: pages
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          cache: true

      - name: build step
        run: vp run build-static
        env:
          # secrets vs vars: https://docs.github.com/en/actions/learn-github-actions/variables#about-environment-variables
          PUBLIC_APPS_SCRIPT_NEWSLETTER_URL: ${{ vars.PUBLIC_APPS_SCRIPT_NEWSLETTER_URL }}
          # the footer's commit link; a fork gets its own without changing anything
          PUBLIC_GIT_REPO: ${{ github.repository }}

      - name: upload static files as pages artifact
        id: deployment
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/client

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    environment:
      name: pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
